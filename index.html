<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Gravador de Áudio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div class="container-gravador">

        <!-- Botão que para clicar em gravar -->
        <button id="btn-gravador">
            🎤 Clique e Segure para Gravar
        </button>

        <!-- Elemento visual para mostrar o status -->
        <p id="status-gravacao">
            Status: Pronto para gravar
        </p>

        <!-- Inserir essa linha para ouvir a própria gravação após soltar o botão -->
        <audio id="player-audio" controls style="margin-top: 15px; display: none;"></audio>

    </div>

    <script src="js/script.js"></script>

    <script>

        if ('serviceWorker' in navigator) {

            window.addEventListener('load', () => {

                navigator.serviceWorker.register('/sw.js')

                    .then(reg => console.log('Service Worker registrado com sucesso!', reg))

                    .catch(err => console.log('Falha ao registrar o Service Worker:', err));

            });

        }

    </script>

</body>

</html>
